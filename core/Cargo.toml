[package]
name = "pulse-core"
version = "0.1.0"
edition = "2021"
default-run = "pulse-daemon"

[lib]
name = "pulse_core"
path = "src/lib.rs"

[[bin]]
name = "pulse-daemon"
path = "src/main.rs"

[[bin]]
name = "pulse"
path = "src/bin/pulse_cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
signal-hook = "0.3"
